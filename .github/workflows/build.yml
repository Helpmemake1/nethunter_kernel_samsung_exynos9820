name: NetHunter Kernel Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libssl-dev libncurses5-dev zip gcc-aarch64-linux-gnu

            - name: Build Kernel and Modules
              run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make nethunter_beyond1lte_defconfig
          # The -k flag tells 'make' to keep going even if there are errors
          make -k -j$(nproc) KCFLAGS="-w" || true

      - name: Prepare AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          # Find the compiled kernel image
          find . -name "Image.gz-dtb" -exec cp {} AnyKernel3/ \;
          mkdir -p AnyKernel3/modules
          # This grab your slcan.ko and rt2800usb.ko drivers
          find . -name "*.ko" -exec cp {} AnyKernel3/modules/ \;
          # Use your custom anykernel.sh if it exists, otherwise use the default
          cp anykernel.sh AnyKernel3/anykernel.sh || true

      - name: Create Flashable ZIP
        run: |
          cd AnyKernel3 && zip -r9 ../NetHunter-Kernel-S10.zip *

      - name: Export Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Kernel-S10
          path: NetHunter-Kernel-S10.zip
